<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:monospace;
    color:#0f0;
}

/* MATRIX */
#matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* SCREENS */
#login,
#terminal,
#final{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* LOGIN */
input{
    padding:12px;
    width:250px;
    background:black;
    border:1px solid #0f0;
    color:#0f0;
    text-align:center;
    outline:none;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:#0f0;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

/* TERMINAL */
#terminal{
    display:none;
}

#text{
    width:90%;
    max-width:700px;
    white-space:pre-line;
    line-height:1.8;
}

/* SCARE */
#scare{
    position:fixed;
    inset:0;
    display:none;
    z-index:999;
}

#scare img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* FINAL */
#final{
    display:none;
    color:white;
    text-align:center;
}

/* SHAKE */
.shake{
    animation:shake .1s infinite;
}

@keyframes shake{
    0%{transform:translate(5px,5px);}
    25%{transform:translate(-5px,5px);}
    50%{transform:translate(5px,-5px);}
    75%{transform:translate(-5px,-5px);}
    100%{transform:translate(0,0);}
}
</style>
</head>

<body>

<!-- MATRIX -->
<canvas id="matrix"></canvas>

<!-- LOGIN -->
<div id="login">
    <h1>SECURE ACCESS</h1>
    <input id="code" placeholder="ENTER CODE">
    <button onclick="startHack()">ENTER</button>
</div>

<!-- TERMINAL -->
<div id="terminal">
    <div id="text">Initializing...</div>
</div>

<!-- SCARE -->
<div id="scare">
    <img src="https://i.imgur.com/7kLC6vH.jpg">
</div>

<!-- FINAL -->
<div id="final">
    <h1>😈 تم رصدك بواسطة الهاكر سيودة</h1>
    <p>😂 بهزر يا بطل</p>
    <button onclick="location.reload()">RESTART</button>
</div>

<audio id="scream" src="https://www.fesliyanstudios.com/play-mp3/4386"></audio>

<script>

window.onload = function(){

    /* MATRIX */
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const letters = "01HACKER#$%&@";
    const array = letters.split("");

    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = [];

    for(let i=0;i<columns;i++){
        drops[i]=1;
    }

    function draw(){
        ctx.fillStyle="rgba(0,0,0,0.05)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="#0F0";
        ctx.font=fontSize+"px monospace";

        for(let i=0;i<drops.length;i++){
            const text=array[Math.floor(Math.random()*array.length)];
            ctx.fillText(text,i*fontSize,drops[i]*fontSize);

            if(drops[i]*fontSize > canvas.height && Math.random()>0.975){
                drops[i]=0;
            }

            drops[i]++;
        }
    }

    setInterval(draw,33);
};

/* HACK TEXT */
const text = document.getElementById("text");
const scream = document.getElementById("scream");

const lines = [
    "Connecting...",
    "Access granted...",
    "Scanning system...",
    "Tracking target...",
    "Collecting data...",
    "WARNING !!!",
    "FINAL PROTOCOL..."
];

let i = 0;

function runHack(){

    if(i < lines.length){

        text.innerHTML += "\n" + lines[i];

        i++;

        setTimeout(runHack,1000);

    } else {

        finalScare();
    }
}

function startHack(){

    document.getElementById("login").style.display="none";
    document.getElementById("terminal").style.display="flex";

    setTimeout(runHack,500);
}

/* SCARE */
function finalScare(){

    document.body.classList.add("shake");

    document.getElementById("scare").style.display="block";

    scream.play();

    setTimeout(()=>{

        document.body.classList.remove("shake");

        document.getElementById("scare").style.display="none";

        document.getElementById("terminal").style.display="none";

        document.getElementById("final").style.display="flex";

    },4000);
}

</script>

</body>
</html>
