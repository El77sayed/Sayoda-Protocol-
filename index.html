<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:monospace;
    color:#0f0;
}

/* MATRIX BACKGROUND */
#matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* SCREENS */
#login,
#terminal,
#final{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* LOGIN */
#login h1{
    margin-bottom:20px;
    text-shadow:0 0 10px #0f0;
}

input{
    padding:12px;
    width:250px;
    background:black;
    border:1px solid #0f0;
    color:#0f0;
    text-align:center;
    outline:none;
    font-size:18px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    background:#0f0;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* TERMINAL */
#terminal{
    display:none;
}

#text{
    width:90%;
    max-width:700px;
    white-space:pre-line;
    line-height:1.8;
    font-size:18px;
    text-shadow:0 0 5px #0f0;
}

/* SCARY IMAGE */
#scare{
    position:fixed;
    inset:0;
    display:none;
    z-index:999;
}

#scare img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* WARNING */
#warning{
    position:fixed;
    inset:0;
    background:red;
    opacity:0;
    z-index:500;
}

/* FINAL SCREEN */
#final{
    display:none;
    color:white;
    text-align:center;
    background:black;
}

#final h1{
    font-size:40px;
    margin-bottom:20px;
}

/* SHAKE EFFECT */
.shake{
    animation:shake .1s infinite;
}

@keyframes shake{
    0%{transform:translate(5px,5px);}
    25%{transform:translate(-5px,5px);}
    50%{transform:translate(5px,-5px);}
    75%{transform:translate(-5px,-5px);}
    100%{transform:translate(0,0);}
}

/* GLITCH */
.glitch{
    animation:glitch 0.2s infinite;
}

@keyframes glitch{
    0%{text-shadow:2px 0 red;}
    25%{text-shadow:-2px 0 blue;}
    50%{text-shadow:2px 2px red;}
    75%{text-shadow:-2px -2px blue;}
    100%{text-shadow:0 0 5px #0f0;}
}
</style>
</head>

<body>

<!-- MATRIX -->
<canvas id="matrix"></canvas>

<!-- LOGIN -->
<div id="login">
    <h1 class="glitch">SECURE ACCESS</h1>
    <input id="code" placeholder="ENTER ACCESS CODE">
    <button onclick="startHack()">ENTER</button>
</div>

<!-- TERMINAL -->
<div id="terminal">
    <div id="text">Initializing System...</div>
</div>

<!-- WARNING -->
<div id="warning"></div>

<!-- SCARE -->
<div id="scare">
    <img src="https://i.imgur.com/7kLC6vH.jpg">
</div>

<!-- FINAL -->
<div id="final">
    <h1>😈 تم رصدك بواسطة الهاكر سيودة</h1>
    <p>😂 بهزر يا بطل</p>
    <button onclick="location.reload()">إعادة التشغيل</button>
</div>

<!-- SOUNDS -->
<audio id="typing" src="https://www.fesliyanstudios.com/play-mp3/387"></audio>
<audio id="scream" src="https://www.fesliyanstudios.com/play-mp3/4386"></audio>

<script>
/* MATRIX EFFECT */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01HACKER#$%&@";
const array = letters.split("");

const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++){
    drops[i]=1;
}

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#0F0";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){

        const text=array[Math.floor(Math.random()*array.length)];

        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random()>0.975){
            drops[i]=0;
        }

        drops[i]++;
    }
}

setInterval(draw,33);

/* HACK SCREEN */
const text = document.getElementById("text");
const typing = document.getElementById("typing");
const scream = document.getElementById("scream");

const username = new URLSearchParams(window.location.search).get("name") || "UNKNOWN USER";

const lines = [
    "Connecting to dark server...",
    "Access granted...",
    "Decrypting private files...",
    "Tracking target: " + username,
    "Collecting information...",
    "Uploading data...",
    "WARNING !!!",
    "TARGET FOUND",
    "Launching final protocol..."
];

let i = 0;

function typeLine(line){
    text.innerHTML += "\\n" + line;

    typing.currentTime = 0;
    typing.play();
}

function runHack(){

    if(i < lines.length){

        typeLine(lines[i]);

        if(lines[i].includes("WARNING")){
            flashWarning();
        }

        i++;

        setTimeout(runHack,1000);

    } else {

        finalScare();
    }
}

function startHack(){

    document.getElementById("login").style.display="none";
    document.getElementById("terminal").style.display="flex";

    runHack();
}

/* WARNING FLASH */
function flashWarning(){

    const warning = document.getElementById("warning");

    warning.style.opacity="0.6";

    setTimeout(()=>{
        warning.style.opacity="0";
    },200);
}

/* FINAL SCARE */
function finalScare(){

    document.body.classList.add("shake");

    document.getElementById("scare").style.display="block";

    scream.play();

    setTimeout(()=>{

        document.body.classList.remove("shake");

        document.getElementById("scare").style.display="none";

        document.getElementById("terminal").style.display="none";

        document.getElementById("final").style.display="flex";

    },4000);
}
</script>

</body>
</html>
