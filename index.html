<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSIFIED ACCESS</title>

<style>
body{
    margin:0;
    background:black;
    color:#00ff00;
    font-family:monospace;
    overflow:hidden;
}

/* MATRIX */
#matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

#terminal{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#text{
    white-space:pre-line;
    text-align:center;
    font-size:18px;
    padding:20px;
}

#scare{
    position:fixed;
    inset:0;
    display:none;
    z-index:999;
}

#scare img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* FLASH RED */
#flash{
    position:fixed;
    inset:0;
    background:red;
    opacity:0;
}

/* FINAL */
#final{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
}

/* SHAKE */
.shake{
    animation:shake .1s infinite;
}

@keyframes shake{
    0%{transform:translate(5px,5px);}
    25%{transform:translate(-5px,5px);}
    50%{transform:translate(5px,-5px);}
    75%{transform:translate(-5px,-5px);}
    100%{transform:translate(0,0);}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="terminal">
    <div id="text">BOOTING CLASSIFIED SYSTEM...</div>
</div>

<div id="flash"></div>

<div id="scare">
    <img src="https://i.imgur.com/7kLC6vH.jpg">
</div>

<div id="final">
    <h1>😈 تم رصد الهدف</h1>
    <p>😂 متخفش يا معلم</p>
</div>

<audio id="scream" src="https://www.fesliyanstudios.com/play-mp3/4386"></audio>

<script>

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01CLASSIFIEDHACKER$#@";
const arr = letters.split("");

const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for(let i=0;i<columns;i++) drops[i]=1;

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff00";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){
        const text = arr[Math.floor(Math.random()*arr.length)];
        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random()>0.975){
            drops[i]=0;
        }
        drops[i]++;
    }
}
setInterval(draw,33);

/* TERMINAL */
const text = document.getElementById("text");
const scream = document.getElementById("scream");

const lines = [
    "Connecting to secure server...",
    "Access granted...",
    "Bypassing firewall...",
    "Scanning device...",
    "Tracking location...",
    "Downloading data...",
    "WARNING: UNKNOWN ACTIVITY DETECTED",
    "FINAL PROTOCOL ACTIVATED..."
];

let i = 0;

window.onload = function(){
    run();
};

function run(){
    if(i < lines.length){
        text.innerText += "\n" + lines[i];
        i++;
        setTimeout(run, 900);
    } else {
        scare();
    }
}

/* SCARE */
function scare(){

    document.body.classList.add("shake");

    document.getElementById("flash").style.opacity="0.7";

    document.getElementById("scare").style.display="block";

    scream.play();

    setTimeout(()=>{

        document.body.classList.remove("shake");

        document.getElementById("scare").style.display="none";

        document.getElementById("flash").style.opacity="0";

        document.getElementById("terminal").style.display="none";

        document.getElementById("final").style.display="flex";

    },4000);
}

</script>

</body>
</html>
